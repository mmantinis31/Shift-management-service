expose_php = Off
memory_limit = 256M
max_execution_time = 30
date.timezone = Europe/Vilnius
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
zend.assertions = 1
assert.exception = 1
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
